name: Daily Growth Wave Brief

on:
  schedule:
    - cron: '0 6 * * 1-5'   # 7h Paris heure d'hiver (UTC+1)
  workflow_dispatch:          # Lancement manuel depuis l'onglet Actions

# Permission d'écriture dans le repo pour pousser index.html
permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic markdown

      - name: Run brief
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL:           ${{ secrets.TO_EMAIL }}
          PAGES_URL:          ${{ secrets.PAGES_URL }}
        run: python brief.py

      # Committer et pousser le index.html généré → GitHub Pages le sert automatiquement
      - name: Push brief to GitHub Pages
        run: |
          git config user.name  "GW Brief Bot"
          git config user.email "brief-bot@growth-wave.agency"
          git add index.html news_memory.json
          git commit -m "Brief $(date +'%Y-%m-%d')" || echo "Rien à committer"
          git push
